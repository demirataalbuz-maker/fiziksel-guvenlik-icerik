<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiziksel Güvenlik</title>
<meta name="description" content="Fiziksel güvenlik (saha) çalışma uygulaması">
<meta name="theme-color" content="#0e0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fiziksel Güvenlik">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,600..900&display=swap">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
/* iOS tasarım dili — sistem renkleri, sistem yazı tipi, gruplanmış kartlar.
   Değişken adları eski temayla aynı tutuldu (JS satır içi stiller bunları kullanıyor). */
:root{
  color-scheme:dark;
  --ink:#f2f2f7;            /* systemGroupedBackground */
  --card:#ffffff;           /* secondarySystemGroupedBackground */
  --panel:rgba(249,249,249,.94);
  --sunk:rgba(118,118,128,.12);   /* tertiarySystemFill */
  --line:rgba(60,60,67,.18);
  --line-soft:rgba(60,60,67,.12);
  --text:#000000;
  --soft:rgba(60,60,67,.85);
  --dim:rgba(60,60,67,.6);
  --accent:#007aff; --accent-dim:#0062cc; --accent-ink:#ffffff;
  --good:#34c759; --warn:#ff9500; --bad:#ff3b30;
  --c1:#007aff; --c2:#5856d6; --c3:#ff2d55; --c4:#ff9500; --c5:#af52de;
  --c6:#30b0c7; --c7:#ff3b30; --c8:#34c759; --c9:#5ac8fa; --c10:#a2845e;
  --code:#1c1c1e;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Mono",Consolas,monospace;
  --r:12px;
  --shadow:0 1px 0 rgba(0,0,0,.02);
}
@media all{
  /* irzubal "Mor Baski" gece baskisi: siyah kagit, mor vurgu */
  :root{
    --ink:#0e0d12; --card:#17151c; --panel:rgba(19,17,24,.86);
    --sunk:rgba(172,160,196,.13);
    --line:rgba(236,231,221,.14); --line-soft:rgba(236,231,221,.09);
    --text:#ece7dd; --soft:#cfc9bf; --dim:#8a8494;
    --accent:#c07cff; --accent-dim:#a860f0; --accent-ink:#0e0d12;
    --good:#7fd6a4; --warn:#ffc15e; --bad:#ff4a3d;
    --c1:#ff4a3d; --c2:#4a86ff; --c3:#c07cff; --c4:#ffc15e; --c5:#ff6fb5;
    --c6:#4fd1c5; --c7:#ff8a4c; --c8:#7fd6a4; --c9:#8f94ff; --c10:#ff7089;
    --code:#0b0a0e;
    --display:"Anybody","Arial Narrow",var(--sans);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:var(--sans); font-size:17px; line-height:1.35; letter-spacing:-.41px;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
.app{min-height:100%;display:flex;flex-direction:column}

/* ---------- gezinme çubuğu (cam) ---------- */
.top{
  position:sticky; top:0; z-index:20;
  background:var(--panel);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex; align-items:center; gap:10px; min-height:44px;
}
.brand{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:19px;letter-spacing:0;display:flex;align-items:center;gap:8px}
.brand .appicon{width:26px;height:26px;border-radius:6px;flex:none;
  background:linear-gradient(160deg,#ff4a3d,#c07cff 50%,#4a86ff);
  display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.brand .appicon svg{width:15px;height:15px;fill:#fff}
.brand b{font-weight:600;color:inherit}
.brand span{display:none}
.topright{margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--dim);letter-spacing:-.08px;cursor:pointer}
.topright b{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.24px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim)}
.syncdot.on{background:var(--good)}
.syncdot.off{background:var(--warn)}

main{flex:1;padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:720px;width:100%;margin:0 auto}

/* ---------- sekme çubuğu (cam) ---------- */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--panel);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--line);
  padding:4px 4px calc(2px + env(safe-area-inset-bottom,0px));
}
.tab{
  appearance:none;border:0;background:none;color:#999999;
  font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.1px;
  padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;min-height:49px;justify-content:center;
}
.tab{color:#8e8e93}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] svg{stroke-width:2.1}

/* ---------- ortak ---------- */
h2{font-family:var(--display);font-stretch:80%;font-size:36px;font-weight:800;letter-spacing:-.2px;line-height:1.2;margin:10px 0 2px;text-wrap:balance}
.sub{color:var(--dim);font-size:15px;letter-spacing:-.24px;line-height:1.4;margin:0 0 16px}
.card{background:var(--card);border:0;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:20px}
.rule{display:none}
.mono{font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.08px}
.dim{color:var(--dim)}
.soft{color:var(--soft)}
button{font-family:inherit}
.btn{
  appearance:none;border:0;background:var(--sunk);color:var(--accent);
  border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;letter-spacing:-.41px;
  cursor:pointer;min-height:50px;transition:opacity .15s,transform .15s;
}
.btn:active{opacity:.6;transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);font-weight:400}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
select,textarea,input[type=search],input[type=password],input[type=text]{
  appearance:none;-webkit-appearance:none;background:var(--sunk);border:0;color:var(--text);
  border-radius:10px;padding:11px 12px;font-family:inherit;font-size:17px;letter-spacing:-.41px;
  min-height:44px;width:100%;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}

/* ---------- plan şeridi (Etkinlik halkaları gibi) ---------- */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:14px}
.pcell{background:var(--sunk);border:0;border-radius:10px;padding:8px 4px 7px;text-align:center}
.pcell b{display:block;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.06px}
.pcell i{display:block;font-style:normal;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);margin-top:1px;letter-spacing:-.24px}
.pcell.done{background:color-mix(in srgb,var(--good) 16%,transparent)}
.pcell.done i{color:var(--good)}
.pcell.part i{color:var(--accent)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;border:0}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

/* ---------- sınav ---------- */
.qmeta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);letter-spacing:-.08px;margin-top:8px}
.qmeta b{color:var(--text);font-weight:600}
.badge{border:0;background:var(--sunk);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;color:var(--soft);letter-spacing:0}
.badge.hand{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.qprompt{font-size:22px;font-weight:700;line-height:1.27;letter-spacing:.35px;margin:12px 0 0;text-wrap:pretty}
.qctx{
  background:var(--card);border:0;border-radius:12px;padding:14px 16px;margin-top:14px;
  color:var(--soft);font-size:16px;line-height:1.45;letter-spacing:-.32px;max-height:40vh;overflow:auto;
}
.qctx.payload{font-family:var(--mono);font-size:14px;line-height:1.5;letter-spacing:0;color:#e5e5ea;background:var(--code);
  white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:0;margin-top:18px;background:var(--card);border-radius:12px;overflow:hidden}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:0;border-radius:0;position:relative;
  padding:14px 16px;color:var(--text);font-size:17px;line-height:1.3;letter-spacing:-.41px;
  cursor:pointer;min-height:52px;transition:background .15s;
}
.opt + .opt::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--line)}
.opt:active:not([disabled]){background:var(--sunk)}
.opt kbd{
  font-family:var(--sans);font-size:13px;font-weight:600;background:var(--sunk);border:0;
  border-radius:50%;width:24px;height:24px;display:grid;place-items:center;padding:0;
  color:var(--dim);flex:none;margin-top:-1px;letter-spacing:0;
}
.opt.correct{background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.correct kbd{background:var(--good);color:var(--accent-ink)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt.wrong kbd{background:var(--bad);color:var(--accent-ink)}
.opt.muted{opacity:.4}
.opt[disabled]{cursor:default}
.verdict{margin-top:20px;padding:16px;border-radius:12px;border:0;background:var(--card)}
.verdict h3{margin:0 0 8px;font-family:var(--display);font-stretch:85%;font-size:22px;font-weight:800;letter-spacing:0}
.verdict.ok h3{color:var(--good)}
.verdict.no h3{color:var(--bad)}
.sureq{font-size:15px;color:var(--soft);margin:0 0 12px;letter-spacing:-.24px}
.lesson{white-space:pre-wrap;font-size:15px;line-height:1.5;letter-spacing:-.24px;color:var(--soft);max-height:46vh;overflow:auto;margin-top:6px}
.lesson a{color:var(--accent);word-break:break-all;text-decoration:none}

/* ---------- listeler ---------- */
.item{background:var(--card);border:0;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.item h4{margin:0;font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.41px}
.item .k{font-size:13px;letter-spacing:-.08px;color:var(--dim);font-family:var(--sans)}
.item .ex{
  font-family:var(--mono);font-size:13px;letter-spacing:0;color:#e5e5ea;background:var(--code);
  border:0;border-radius:10px;padding:12px;margin-top:10px;
  white-space:pre-wrap;word-break:break-word;max-height:30vh;overflow:auto;
}
.truth{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;margin-top:8px;letter-spacing:0}
.truth.real{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);border:0}
.truth.comp{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border:0}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  appearance:none;border:0;background:var(--sunk);color:var(--text);flex:none;
  border-radius:99px;padding:7px 14px;font-size:15px;font-weight:500;letter-spacing:-.24px;cursor:pointer;min-height:34px;
  transition:background .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.empty{color:var(--dim);font-size:15px;padding:28px 4px;text-align:center}
.count{font-size:13px;color:var(--dim);margin:2px 0 10px;text-transform:uppercase;letter-spacing:-.08px;font-family:var(--sans)}
.report{white-space:pre-wrap;font-size:15px;line-height:1.5;letter-spacing:-.24px;color:var(--soft)}
.report b{color:var(--text)}
.tag{font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px;border:0;background:var(--sunk);color:var(--dim);letter-spacing:.06px;font-family:var(--sans)}
.tag.free{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.tag.paid{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
a.link{color:var(--accent);text-decoration:none;font-weight:400;font-size:15px}
.selchip{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;
  padding:12px 20px;font-family:var(--sans);font-weight:600;font-size:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);max-width:calc(100% - 32px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
#view > *{animation:rise .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= KIVILCIM (maskot) ================= */
main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.kv-dock{position:fixed;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:35;
  width:74px;height:86px;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.kv-dock svg{width:100%;height:100%;overflow:visible}
.kv-scale{transform-origin:100px 205px;transition:transform .7s cubic-bezier(.3,1.4,.5,1),filter .7s}
.kv-flick{transform-origin:100px 205px;animation:kvFlick 1.6s ease-in-out infinite}
.kv-flick2{transform-origin:100px 205px;animation:kvFlick2 1.1s ease-in-out infinite}
@keyframes kvFlick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.98,1.04) skewX(-2deg)}60%{transform:scale(1.02,.97) skewX(2deg)}}
@keyframes kvFlick2{0%,100%{transform:scale(1,1)}50%{transform:scale(.95,1.07) skewX(-3deg)}}
.kv-body{transform-origin:100px 205px}
.kv-body.happy{animation:kvHop 2.4s cubic-bezier(.3,0,.4,1) infinite}
@keyframes kvHop{0%,60%,100%{transform:translateY(0)}72%{transform:translateY(-16px)}80%{transform:translateY(-16px)}92%{transform:translateY(0) scale(1.05,.93)}}
.kv-body.wait,.kv-body.new{animation:kvSway 3s ease-in-out infinite}
@keyframes kvSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.kv-body.sulk{transform:scaleX(-1) rotate(-4deg)}
.kv-body.out{animation:kvDroop 4s ease-in-out infinite}
@keyframes kvDroop{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) scale(1.02,.97)}}
.kv-body.jump{animation:kvJump .6s cubic-bezier(.3,0,.4,1)}
@keyframes kvJump{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px) rotate(-6deg)}75%{transform:translateY(0) scale(1.08,.9)}}
.kv-body.shake{animation:kvShake .5s}
@keyframes kvShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.kv-pupils{animation:kvLook 4s ease-in-out infinite}
@keyframes kvLook{0%,35%{transform:translateX(0)}45%,60%{transform:translateX(-4px)}70%,85%{transform:translateX(4px)}100%{transform:translateX(0)}}
.kv-eyes{transform-origin:100px 153px;animation:kvBlink 4.5s infinite}
@keyframes kvBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.kv-spark{animation:kvRise 1.8s linear infinite;opacity:0}
@keyframes kvRise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-120px);opacity:0}}
.kv-smoke{animation:kvSmoke 3s ease-out infinite;opacity:0}
@keyframes kvSmoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.5}100%{transform:translate(-10px,-90px) scale(1.6);opacity:0}}
.kv-crown{transform-origin:100px 20px;animation:kvCrown 2s ease-in-out infinite}
@keyframes kvCrown{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
.kv-bubble{position:fixed;right:12px;bottom:calc(154px + env(safe-area-inset-bottom,0px));z-index:36;
  max-width:min(300px,calc(100% - 24px));background:var(--card);border:1px solid rgba(192,124,255,.35);
  border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:15px;line-height:1.4;letter-spacing:-.2px;color:var(--text);
  box-shadow:0 12px 32px rgba(0,0,0,.5);transform-origin:100% 100%;animation:kvPop .35s cubic-bezier(.3,1.5,.5,1)}
.kv-bubble[hidden]{display:none}
.kv-bubble small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--accent);margin-bottom:3px;font-family:var(--display);font-stretch:85%}
.kv-bubble b{color:var(--accent)}
.kv-bubble .kv-act{display:flex;gap:8px;margin-top:10px}
.kv-bubble .kv-act button{flex:1;border:0;border-radius:10px;padding:9px 10px;font:600 14px var(--sans);cursor:pointer;background:var(--sunk);color:var(--text)}
.kv-bubble .kv-act button.go{background:var(--accent);color:var(--accent-ink)}
@keyframes kvPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.kv-top{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:15px;color:var(--text);margin-right:4px}
.kv-top svg{width:14px;height:17px}
.kv-confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.kv-confetti i{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0;animation:kvFall var(--t) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes kvFall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.kv-puff{position:fixed;pointer-events:none;z-index:37;width:7px;height:7px;border-radius:50%;animation:kvPuff .9s ease-out forwards}
@keyframes kvPuff{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
@media (prefers-reduced-motion:reduce){.kv-dock *,.kv-confetti,.kv-puff{animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><i class="appicon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3zm-1.2 13.6-3.4-3.4 1.4-1.4 2 2 4.6-4.6 1.4 1.4-6 6z"/></svg></i><b>Fiziksel Güvenlik</b><span>saha · yetkili test</span></div>
    <div class="topright">
      <span class="kv-top" id="kvTop"></span><b id="todayCount">0/220</b><span>bugün</span>
      <span class="syncdot" id="syncDot" title="senkron"></span>
    </div>
  </header>

  <main id="view"></main>
  <button class="selchip" id="selChip" hidden></button>
  <button class="kv-dock" id="kvDock" aria-label="Kıvılcım"></button>
  <div class="kv-bubble" id="kvBubble" role="status" hidden></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="path" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M5 11v5c0 1.1 3.1 3 7 3s7-1.9 7-3v-5"/></svg>Yol</button>
    <button class="tab" role="tab" data-tab="exam" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Sınav</button>

<script id="seed" type="application/json">{"built":"2026-10-01","categories":{"FZ01":"Keşif & Gözetleme","FZ02":"Çevre & Bariyerler","FZ03":"Giriş Kontrol & Kimlik","FZ04":"Kilit & Mekanik Bypass","FZ05":"Alarm & Algılayıcılar","FZ06":"Gözetim & Kamera","FZ07":"RF & Kablosuz Sinyaller","FZ08":"Donanım Arayüzleri & İmplant","FZ09":"İnsan Katmanı","FZ10":"OPSEC, Belgeleme & Yetki"},"attacks":[{"id":"FZ01-001","category":"FZ01","technique":"Pasif tesis keşfi (OSINT)","story":"Bir degerlendirmede ekip, hedef binaya hic yaklasmadan uydu goruntusu, is ilanlari ve calisanlarin paylastigi rozet fotograflarindan giris noktalarini, kart tasarimini ve vardiya duzenini cikardi.","example":"Acik kaynaklar: harita/uydu katmani, sokak goruntusu, sosyal medya foto metadata'si, is ilanlarindaki teknoloji ipuclari.","why":"Saldiri yuzeyinin buyuk kismi halka acik bilgiden kurulabilir.","how_to_use":"Angajman oncesi pasif kesif ile risk haritasi cikar; nelerin disaridan gorunur oldugunu musteriye raporla.","mitigation":"Calisan farkindaligi: rozet/ekran/badge fotografi paylasmama; metadata temizligi.","source":"https://osintframework.com/","level":"core","status":"active"},{"id":"FZ01-002","category":"FZ01","technique":"Düşman gözlemi (hostile recon) penceresi","story":"Ekip birkac gun boyunca uzaktan giris-cikis saatlerini, sigara molasi kapilarini ve kurye kabul saatlerini not etti; en zayif zaman araligini boylece belirledi.","example":"Gozlem gunlugu: saat, kapi, kisi akisi, refakatsiz anlar.","why":"Insan ve surec paternleri tekrar eder; tekrar = ongorulebilir zayiflik.","how_to_use":"Degerlendirmede en savunmasiz zaman penceresini tespit edip prosedur onerisi ver.","mitigation":"Rastgele devriye, kamera gozetimi, 'gordugunu bildir' kulturu.","source":"https://trustedsec.com/blog","level":"core","status":"active"},{"id":"FZ01-003","category":"FZ01","technique":"Çöp istihbaratı (dumpster diving)","story":"Atik konteynerinden cikan eski ziyaretci defterleri, yazdirilmis e-postalar ve atilmis prox kartlar, ekibe gecerli isimler ve kart bicimi hakkinda bilgi verdi.","example":"Imha edilmemis belge, etiket, ambalaj ve eski erisim kartlari.","why":"Hassas bilgi cogu zaman cope dogru imha edilmeden atilir.","how_to_use":"Fiziksel bilgi sizintisini gostererek imha politikasi onerisi sun.","mitigation":"Kilitli shredder, atik siniflandirma, kart iade/iptal sureci.","source":"https://www.sans.org/","level":"core","status":"active"},{"id":"FZ01-004","category":"FZ01","technique":"Termal/IR ile kullanım izi okuma","story":"Tus takimli bir giriste, yeni basilmis tuslarin birakti isi izleri termal kamerayla gorulebildi; bu, PIN denemelerini ciddi daralti.","example":"Tus takiminda son basilan tuslarin sicaklik farki (kavramsal).","why":"Isi, dokunustan sonra bir sure yuzeyde kalir ve sira ipucu verir.","how_to_use":"Keypad'lerin bu sizintiya acikligini degerlendir, demo ile goster.","mitigation":"Isi dagitan kapaklar, tam klavye PIN, kart+PIN iki faktor.","source":"https://www.usenix.org/","level":"advanced","status":"active"},{"id":"FZ02-001","category":"FZ02","technique":"CPTED çevre değerlendirmesi","story":"Degerlendirmede bina cevresi; aydinlatma kor noktalari, gizlenmeyi kolaylastiran bitki ortusu ve gorus hatti engelleri acisindan incelendi ve her biri bir giris firsatina baglandi.","example":"Aydinlatma, gorus hatti, bariyer yuksekligi, dogal gozetim kontrol listesi.","why":"Cevresel tasarim, davranisi ve firsati dogrudan etkiler.","how_to_use":"CPTED ilkeleriyle cevreyi puanla; dusuk maliyetli iyilestirme oner.","mitigation":"Aydinlatma, budama, net gorus hatti, katmanli bariyer.","source":"https://www.cpted.net/","level":"core","status":"active"},{"id":"FZ02-002","category":"FZ02","technique":"Acil çıkış / REX tetikleme","story":"Camli bir kapinin ustundeki hareket tabanli cikis sensoru (REX), disaridan kapi altindan itilen bir aparatla tetiklenince kapi mandali acildi; ekip boylece refakatsiz giris simule etti.","example":"REX (request-to-exit) sensorunun disaridan uyarilmasi (kavramsal).","why":"Cikisi kolaylastiran otomasyon, bazen giris tarafini da zayiflatir.","how_to_use":"REX yerlesimini ve kapi bosluklarini degerlendir; bulugu raporla.","mitigation":"REX'i kapi temasi ile es-dogrula, bosluk kapatma, sensor konumu.","source":"https://trustedsec.com/blog","level":"advanced","status":"active"},{"id":"FZ02-003","category":"FZ02","technique":"Yükleme kapısı / servis girişi zafiyeti","story":"Ana giris sıkı korunurken, surekli acik tutulan yukleme rampasi ve refakatsiz calisan servis kapisi en kolay giris noktasi cikti.","example":"Servis/yukleme kapilarinin acik birakilma ve refakat eksikligi.","why":"Guvenlik en zayif halka kadar guclu; yan kapilar sik ihmal edilir.","how_to_use":"Tum cevre giris noktalarini envantere al, en zayifini vurgula.","mitigation":"Otomatik kapanan kapi, refakat zorunlulugu, kamera+alarm.","source":"https://www.redteamalliance.com/","level":"core","status":"active"},{"id":"FZ02-004","category":"FZ02","technique":"Mantrap / sas kapısı atlatma mantığı","story":"Iki kapili bir gecis odasinin (mantrap) ikinci kapisi, birinci kapi kalabalikken art arda acilinca tek kartla iki kisi gecebildi.","example":"Interlock mantigindaki zamanlama/kalabalik bosluklari (kavramsal).","why":"Tek-kisi-gecis varsayimi, kalabalik veya zamanlama ile bozulabilir.","how_to_use":"Mantrap'in anti-passback ve tek-kisi algilama kalitesini test et.","mitigation":"Anti-passback, zemin sensoru/turnike, tek-kisi dogrulama.","source":"https://trustedsec.com/blog","level":"advanced","status":"active"},{"id":"FZ03-001","category":"FZ03","technique":"125 kHz prox kart klonlama (EM/HID Prox)","story":"Bir degerlendirmede, asansorde yakin mesafeden okunan eski nesil bir prox kartin kimligi, bos bir karta yazilip gecerli bir kopya olusturuldu.","example":"Dusuk frekansli, sifrelemesiz kartlarin ID'sinin okunup kopyalanmasi.","why":"Eski 125 kHz kartlar genelde sadece bir ID yayinlar, kimlik dogrulamaz.","how_to_use":"Kullanilan kart teknolojisini tespit et; eskiyse yukseltme oner.","mitigation":"Sifreli/karsilikli dogrulamali kart ( or. SEOS), kart+PIN.","source":"https://github.com/RfidResearchGroup/proxmark3/wiki","level":"core","status":"active"},{"id":"FZ03-002","category":"FZ03","technique":"MIFARE Classic zayıflıkları","story":"13.56 MHz bir kartta, zayif anahtar uretimi ve bilinen kripto zaafi nedeniyle sektor anahtarlari cikarilip kart icerigi okunabildi.","example":"Zayif/varsayilan anahtarlar ve bilinen kripto zaaflari (kavramsal).","why":"Eski MIFARE Classic kripto'su kirik kabul edilir.","how_to_use":"Kart ailesini ve anahtar yonetimini degerlendir; raporla.","mitigation":"DESFire EV2/EV3 gibi modern kart, dogru anahtar yonetimi.","source":"https://github.com/RfidResearchGroup/proxmark3/wiki","level":"advanced","status":"active"},{"id":"FZ03-003","category":"FZ03","technique":"Wiegand hattı araya girme (reader MITM)","story":"Kart okuyucu ile kontrol paneli arasindaki eski Wiegand kablolamasina takilan kucuk bir cihaz, gecen kart kimliklerini kaydedip sonra tekrar oynatabildi.","example":"Sifrelenmemis Wiegand hattinin dinlenmesi/tekrari (kavramsal).","why":"Klasik Wiegand protokolu kimlik dogrulama ve sifreleme icermez.","how_to_use":"Okuyucu-panel haberlesmesinin sifreli olup olmadigini test et.","mitigation":"OSDP (Secure Channel) gecisi, kablo korumasi, tamper alarmi.","source":"https://www.redteamalliance.com/","level":"advanced","status":"active"},{"id":"FZ03-004","category":"FZ03","technique":"NFC / mobil kimlik relay mantığı","story":"Mobil rozet kullanan bir sistemde, iki cihaz arasinda kurulan bir koru ile okuyucuya uzaktaki gecerli bir telefonun sinyali aktarilmaya calisildi (relay).","example":"Iki uc arasinda NFC sinyalinin geciktirmesiz aktarimi (kavramsal).","why":"Yakinlik varsayimi, sinyal aktarimiyla (relay) asilabilir.","how_to_use":"Mesafe-sinirli (distance bounding) dogrulama var mi test et.","mitigation":"Distance bounding, kullanici etkilesimi (tap+onay), zaman siniri.","source":"https://www.usenix.org/","level":"advanced","status":"active"},{"id":"FZ04-001","category":"FZ04","technique":"Single pin picking & raking","story":"Locksport pratiginde, standart pimli bir asma kilit; gerginlik anahtari ve pik ile pimler tek tek shear line'a getirilerek acildi.","example":"Pimli silindir kilitlerin manuel manipulasyonu (locksport, izinli).","why":"Uretim toleranslari pimlerin sirayla ayarlanmasina izin verir.","how_to_use":"Kilit sinifini (or. yuksek guvenlik) degerlendir; dayaniklilik raporla.","mitigation":"Pick-dirençli silindir, guvenlik pimleri, sertifikali kilit.","source":"https://www.artoflockpicking.com/","level":"core","status":"active"},{"id":"FZ04-002","category":"FZ04","technique":"Bump key","story":"Uygun kesilmis bir 'bump' anahtar, kilide takilip hafif darbeyle tum pimler ayni anda shear line'in ustune ziplatilarak kilit acildi.","example":"Pimleri ani enerjiyle hizalayan bump anahtar teknigi (kavramsal).","why":"Newton etkisi pimleri bir an icin ayirir.","how_to_use":"Kilidin bump'a dayanikliligini degerlendir, demo ile goster.","mitigation":"Bump-dirençli pimler, programlanabilir silindir, elektronik kilit.","source":"https://toool.us/","level":"core","status":"active"},{"id":"FZ04-003","category":"FZ04","technique":"Latch shimming / loiding","story":"Yayli (spring latch) bir kapida, kapi ile cerceve arasindan gecirilen ince esnek bir kart mandali geri itti ve kapi anahtarsiz acildi.","example":"Egimli mandalin esnek bir aparatla geri itilmesi (kavramsal).","why":"Deadbolt'suz yayli mandallar yanal basinca zayiftir.","how_to_use":"Kapilarda deadlatch/deadbolt var mi degerlendir.","mitigation":"Deadbolt, anti-shim deadlatch, kapi bosluk plakasi.","source":"https://www.artoflockpicking.com/","level":"core","status":"active"},{"id":"FZ04-004","category":"FZ04","technique":"Bypass araçları & under-door tool","story":"Kapinin ic tarafindaki kolu kapi altindan uzatilan kancali bir aparatla cekerek acan klasik bypass; mekanik kilit hic zorlanmadi.","example":"Ic kol/REX/kriko kolunu dolayli tetikleyen bypass aparatlari (kavramsal).","why":"Kilidin kendisi yerine kapi donanimindaki zayif nokta hedeflenir.","how_to_use":"Kapi altindaki bosluk ve ic donanim erisimini degerlendir.","mitigation":"Kapi altı plakasi, ic kol koruma, bosluk kapatma.","source":"https://trustedsec.com/blog","level":"advanced","status":"active"},{"id":"FZ05-001","category":"FZ05","technique":"PIR hareket sensörü kör noktaları","story":"Bir koridordaki PIR sensorun algilama konisi haritalandi; cok yavas ve sensore dogrudan yaklasan hareketin tetiklemeyi gecikmeli yaptigi goruldu.","example":"PIR'in isil degisim ve aci tabanli algilama sinirlari (kavramsal).","why":"PIR, isi farkinin hizli degisimine duyarli; yavas/dik yaklasim zayif algilanir.","how_to_use":"Sensor kapsamasini ve kor noktalari haritala, yerlesim onerisi ver.","mitigation":"Cakisan sensor kapsamasi, dual-tech (PIR+mikrodalga), yukseklik.","source":"https://www.sans.org/","level":"advanced","status":"active"},{"id":"FZ05-002","category":"FZ05","technique":"Manyetik kapı kontağı bypass","story":"Alarmli bir kapida, kapi acilmadan once harici bir miknatis reed anahtarin yanina konunca sistem kapiyi 'kapali' sanmaya devam etti.","example":"Reed switch'i disaridan miknatisla 'kapali' tutma (kavramsal).","why":"Basit manyetik kontaklar sadece miknatis varligini kontrol eder.","how_to_use":"Kontak tipini ve anti-tamper ozelligini degerlendir.","mitigation":"Dengeli (balanced/BMS) manyetik kontak, tamper, konum izleme.","source":"https://www.sans.org/","level":"core","status":"active"},{"id":"FZ05-003","category":"FZ05","technique":"Alarm hattı / siren sabotajı","story":"Dis siren ve haber hattinin fiziksel olarak erisilebilir olmasi, sistemin merkeze haber verme yetenegine karsi bir risk olarak raporlandi.","example":"Haberlesme/guc hattinin kesilmesi veya baskilanmasi (kavramsal).","why":"Alarm, merkeze ulasamazsa caydiriciliginin cogunu yitirir.","how_to_use":"Hat gozetimi (line supervision) ve yedek haberlesme var mi test et.","mitigation":"Suphelesme izlemeli hat, hucresel/IP yedek, pil yedegi.","source":"https://www.sans.org/","level":"advanced","status":"active"},{"id":"FZ05-004","category":"FZ05","technique":"Cam kırılma / titreşim sensörü sınırları","story":"Glassbreak sensorun belirli frekanslara ayarli oldugu, yavas kesme yontemiyle camin o akustik imzayi uretmeden gecilebildigi gosterildi.","example":"Akustik/titresim imzasina dayali algilamanin sinirlari (kavramsal).","why":"Sensor belirli ses profilini arar; farkli yontem imzayi uretmez.","how_to_use":"Sensor tipini ve kapsamayi degerlendir, katmanli algilama oner.","mitigation":"Katmanli sensor (akustik+titresim+hacim), dogru kalibrasyon.","source":"https://www.sans.org/","level":"advanced","status":"active"},{"id":"FZ06-001","category":"FZ06","technique":"Kamera kör nokta haritalama","story":"Tesisteki sabit kameralarin acilari cikarildi ve gorulmeyen gecis koridorlari (kor noktalar) bir rota olusturacak sekilde birlestirildi.","example":"Sabit kamera aci/kapsama bosluklarinin haritalanmasi.","why":"Sabit kameralarin olu acilari ongorulebilir rota birakir.","how_to_use":"Kapsama bosluklarini raporla; PTZ/ek kamera onerisi ver.","mitigation":"Ortusen kapsama, PTZ, analitik hareket uyarisi.","source":"https://www.hackthebox.com/","level":"core","status":"active"},{"id":"FZ06-002","category":"FZ06","technique":"IP kamera varsayılan kimlik / zafiyet","story":"Ag kamerasinin varsayilan sifre ile acik kalmasi ve eski firmware'i, goruntuye ve bazen ic aga erisim riski olarak degerlendirildi.","example":"Varsayilan kimlik, yamalanmamis firmware, acik yonetim portu.","why":"IoT kameralar sik sik varsayilan/eski yapilandirma ile birakilir.","how_to_use":"Kamera envanteri, firmware ve kimlik durumunu degerlendir.","mitigation":"Sifre degisimi, firmware guncel, ag segmentasyonu (VLAN).","source":"https://www.shodan.io/","level":"core","status":"active"},{"id":"FZ06-003","category":"FZ06","technique":"Analog video hat enjeksiyonu","story":"Koaksiyel bir CCTV hattina erisim, onceden kaydedilmis 'bos koridor' goruntusunun hatta verilerek operatorun yanıltilabilecegini gosterdi.","example":"Analog/CVI video hattina replay goruntu enjeksiyonu (kavramsal).","why":"Denetlenmeyen analog hatlar sinyal degisimine acik olabilir.","how_to_use":"Video yolunun fiziksel korumasini ve butunlugunu degerlendir.","mitigation":"Sifreli IP video, hat gozetimi, goruntu butunluk kontrolu.","source":"https://www.defcon.org/","level":"advanced","status":"active"},{"id":"FZ06-004","category":"FZ06","technique":"IR aydınlatma ve görüş sınırları","story":"Gece gorus kamerasinin IR menzili disindaki ve guclu bir IR kaynagiyla 'parlatilan' bolgelerde goruntunun kullanilamaz hale geldigi goruldu.","example":"IR menzil disi bolgeler ve IR parlatma/aydinlatma etkisi (kavramsal).","why":"Gece gorusu sinirli IR menzile ve pozlamaya baglidir.","how_to_use":"Dusuk isik performansini ve IR kapsamayi degerlendir.","mitigation":"Dogru IR yerlesim, WDR kamera, ek aydinlatma.","source":"https://www.hackthebox.com/","level":"advanced","status":"active"},{"id":"FZ07-001","category":"FZ07","technique":"Sabit kod kumanda yakala-tekrarla (replay)","story":"Eski bir bahce/garaj kumandasinin her seferinde ayni sabit kodu yolladigi gorulup kaydedildi; kayit tekrar oynatilinca kapi acildi.","example":"Sabit kodlu uzaktan kumandanin kaydedilip tekrar oynatilmasi (kendi cihazin).","why":"Sabit kod her defasinda ayni oldugundan tekrar oynatilabilir.","how_to_use":"Kullanilan kumanda teknolojisini (sabit vs rolling) degerlendir.","mitigation":"Rolling code, kriptografik kumanda, kimlik dogrulamali kapi.","source":"https://www.rtl-sdr.com/about-rtl-sdr/","level":"core","status":"active"},{"id":"FZ07-002","category":"FZ07","technique":"Rolling code (RollJam tarzı) saldırı mantığı","story":"Bir arastirmada, rolling kod kullanan kumandanin ilk sinyali bastirilip kaydedilerek sonra kullanilabilecegi (jam-and-replay) kavramsal olarak gosterildi.","example":"Sinyali bastir + kaydet + sonra kullan dongusu (kavramsal, kendi cihazin).","why":"Kullanilmayan gecerli bir kod ele gecirilirse bir kez kullanilabilir.","how_to_use":"Kumandanin rolling kod + anti-replay dayanikliligini degerlendir.","mitigation":"Zaman damgali/karsilikli dogrulamali protokol, kisa pencere.","real_case":"Samy Kamkar RollJam","source":"https://samy.pl/","level":"advanced","status":"active","year":2015},{"id":"FZ07-003","category":"FZ07","technique":"433/315 MHz sensör spoofing (SDR)","story":"Bir kablosuz kapi sensorunun 'kapali' mesajinin formati SDR ile cozuldu; kendi test sensorune ait sahte 'kapali' mesaji uretilebildi.","example":"Sifrelenmemis sub-GHz sensor mesajlarinin SDR ile uretimi (kendi cihazin).","why":"Ucuz sensorler cogu zaman kimlik dogrulamasiz duz mesaj yollar.","how_to_use":"Kullanilan kablosuz sensorlerin kimlik dogrulamasini degerlendir.","mitigation":"Kimlik dogrulamali/rolling sensor, denetlenen (supervised) sensor.","source":"https://www.rtl-sdr.com/about-rtl-sdr/","level":"advanced","status":"active"},{"id":"FZ07-004","category":"FZ07","technique":"Kablosuz alarm jamming farkındalığı","story":"Kablosuz alarm bilesenlerinin radyo bandi bogulunca merkeze haber veremedigi, bu nedenle jam-tespit ozelliginin onemi raporlandi.","example":"Alarm radyo bandinin baskilanmasi (farkindalik; kendi laboratuvarin).","why":"Tamamen kablosuz sistemler RF baskisina karsi savunmasiz olabilir.","how_to_use":"Sistemde jam-tespit ve kablolu yedek var mi degerlendir.","mitigation":"Jam-tespit, kablolu yedek hat, denetlenen haberlesme.","source":"https://www.sans.org/","level":"advanced","status":"active"},{"id":"FZ08-001","category":"FZ08","technique":"Ağ 'drop' cihazı (implant)","story":"Toplanti odasindaki bos bir ethernet prizine takilan avuc ici boyutundaki bir cihaz, disa dogru guvenli bir tunel acarak ekibin ic agi uzaktan degerlendirmesine imkan verdi.","example":"Ic aga birakilan, disari call-back yapan kucuk cihaz (yetkili test).","why":"Fiziksel erisim + bos port, ag sinirini kisa devre yapabilir.","how_to_use":"Bos port politikasi, NAC ve cihaz envanterini degerlendir.","mitigation":"802.1X/NAC, bos port kapatma, MAC/port guvenligi, DLP.","source":"https://trustedsec.com/blog","level":"advanced","status":"active"},{"id":"FZ08-002","category":"FZ08","technique":"USB HID keystroke enjeksiyonu","story":"Klavye gibi gorunen bir USB cihaz, takildigi kilitsiz makinede saniyeler icinde onceden yazilmis zararsiz bir komut dizisini 'yazdi' (demo).","example":"Kendini klavye tanitan cihazin otomatik tus gonderimi (kendi makinende demo).","why":"Isletim sistemleri HID klavyeleri varsayilan guvenir kabul eder.","how_to_use":"Kilitsiz oturum ve USB politikasi riskini goster.","mitigation":"Oturum kilidi, USB kontrol/allowlist, HID onay politikasi.","source":"https://www.usenix.org/","level":"advanced","status":"active"},{"id":"FZ08-003","category":"FZ08","technique":"UART / JTAG debug arayüzü erişimi","story":"Bir erisim kontrol panelinin devre kartindaki etiketsiz lehim noktalari UART konsolu cikti; buradan cihaz gunlukleri ve ayar bilgisi okunabildi.","example":"PCB uzerindeki debug (UART/JTAG) arayuzunden cihaz erisimi (kendi cihazin).","why":"Uretici debug arayuzlerini sahada sik sik acik birakir.","how_to_use":"Donanimin debug arayuzu durumunu degerlendir; bulugu raporla.","mitigation":"Debug arayuzu devre disi/kilitli, secure boot, muhurlu muhafaza.","source":"https://hardwear.io/","level":"advanced","status":"active"},{"id":"FZ08-004","category":"FZ08","technique":"SPI flash dump & firmware analizi","story":"Bir IoT cihazin SPI flash yongasindan okunan firmware icinde sabit kodlu bir servis sifresi bulundu; bu, cihaz ailesini etkileyebilecek bir risk olarak raporlandi.","example":"Flash yongadan firmware okuma ve icinde sir/sabit kod arama (kendi cihazin).","why":"Sifresiz flash, tum firmware ve gomulu sirlari aciga cikarir.","how_to_use":"Cihaz firmware'inin sifreli/imzali olup olmadigini degerlendir.","mitigation":"Sifreli flash, imzali firmware, sir yonetimi (secure element).","source":"https://hardwear.io/","level":"advanced","status":"active"},{"id":"FZ09-001","category":"FZ09","technique":"Tailgating / piggybacking","story":"Elinde kahve ve kutularla gelen 'mesgul' bir kisiye kapiyi nazikce tutan calisan, farkinda olmadan refakatsiz girise izin verdi.","example":"Yetkili birinin ardindan kart okutmadan iceri girme.","why":"Nezaket ve aciceli gorunum, kart kontrolunu atlatir.","how_to_use":"Tailgating'e aciklik seviyesini olcup farkindalik egitimi oner.","mitigation":"Turnike/mantrap, 'bir kart bir kisi' kulturu, karsilama gorevlisi.","source":"https://www.social-engineer.org/","level":"core","status":"active"},{"id":"FZ09-002","category":"FZ09","technique":"Pretexting (rol/kimlik uydurma)","story":"Yelek ve klipbordla gelen 'iklimlendirme teknisyeni', onceden toplanan sirket jargonunu kullanarak resepsiyonu ikna etti ve refakat istedi.","example":"Inandirici bir bahane/rol ile guven kazanma (kurye, teknisyen, denetci).","why":"Insanlar uniforma ve kendinden emin anlatiya otomatik guvenir.","how_to_use":"Dogrulama sureclerinin pretext'e dayanikliligini degerlendir.","mitigation":"Randevu/kimlik dogrulama, geri-arama ile teyit, ziyaretci prosedürü.","source":"https://www.social-engineer.org/","level":"core","status":"active"},{"id":"FZ09-003","category":"FZ09","technique":"Yakın mesafe rozet okuma (sosyal yaklaşım)","story":"Asansor veya kuyrukta cok yakin durarak, cantadaki bir okuyucuyla yanindaki kisinin prox kartini birkac santimden okumaya calismak.","example":"Fiziksel yakinlik kurarak kart okuma firsati yaratma (yetkili test).","why":"Dusuk frekansli kartlar birkac cm mesafeden okunabilir.","how_to_use":"Kart teknolojisi + mesafe riskini degerlendir, kilif oner.","mitigation":"RFID engelleyici kilif, sifreli kart, kart+PIN.","source":"https://github.com/RfidResearchGroup/proxmark3/wiki","level":"advanced","status":"active"},{"id":"FZ09-004","category":"FZ09","technique":"Baiting (düşürülmüş medya)","story":"Otoparka ve lobiye birakilan, uzerinde merak uyandiran etiket olan USB bellekler; bir calisan onu is makinesine takinca farkindalik cagrisi tetiklendi.","example":"Merak uyandiran medyayi ortama birakip takilmasini bekleme (zararsiz demo).","why":"Merak ve yardimseverlik, bilinmeyen medyayi taktirir.","how_to_use":"Dusurulmus medya takma oranini olcup egitim onerisi ver.","mitigation":"USB politikasi, farkindalik egitimi, bulunan medyayi IT'ye verme.","source":"https://www.social-engineer.org/","level":"core","status":"active"},{"id":"FZ10-001","category":"FZ10","technique":"Yetki mektubu ('get out of jail')","story":"Ekip, gozaltina alinmalari halinde gosterecekleri imzali yetki mektubunu yanlarinda tasidi; mektup kapsami, iletisim kisisini ve gecerlilik tarihini net belirtiyordu.","example":"Imzali, tarihli, kapsam ve acil iletisim iceren yetki belgesi.","why":"Fiziksel test yasal olarak riskli; yazili yetki vazgecilmezdir.","how_to_use":"Her angajmanda once bu belgeyi hazirla ve ekiple tasi.","mitigation":"Imzali yetki, kapsam dokumani, emniyet/yonetim bilgilendirmesi.","source":"https://trustedsec.com/blog","level":"core","status":"active"},{"id":"FZ10-002","category":"FZ10","technique":"Kapsam & kurallar (Rules of Engagement)","story":"Bir projede hangi binalarin, saatlerin ve yontemlerin kapsam DISINDA oldugu net yazilmayinca ekip yanlis bir kati test etti; RoE bu yuzden kritik cikti.","example":"Hedefler, izinli/yasak yontemler, saat, iletisim ve durdurma kurallari.","why":"Belirsiz kapsam hem musteriyi hem ekibi riske atar.","how_to_use":"Teste baslamadan RoE'yi yazili netlestir ve onaylat.","mitigation":"Yazili RoE, kapsam disi listesi, panik/durdurma prosedürü.","source":"https://www.sans.org/","level":"core","status":"active"},{"id":"FZ10-003","category":"FZ10","technique":"Kanıt toplama & kayıt (chain of custody)","story":"Basarili bir giriste ekip, zaman damgali foto, erisilen alanin notu ve birakilan 'buradaydik' kartiyla bulguyu kaniteledi; bu rapora deger katti.","example":"Zaman damgali foto, not, beacon kart ve delil zinciri kaydi.","why":"Kanitsiz bulgu tartismaya acik; dogru kayit raporu guclendirir.","how_to_use":"Her adimi belgele; kanit zincirini duzenli tut.","mitigation":"Standart kanit sablonu, guvenli saklama, raporlama disiplini.","source":"https://www.sans.org/","level":"core","status":"active"},{"id":"FZ10-004","category":"FZ10","technique":"Operasyon güvenliği (cover & iletişim)","story":"Ekip; kiyafet, arac, cover story ve birbirleriyle sifreli iletisimi onceden planladi; bir uye durdurulunca digerleri sessiz geri cekildi.","example":"Gorunum, cover story, ekip ici iletisim ve geri cekilme plani.","why":"Plansiz ekip, tek bir temasta tum operasyonu ele verir.","how_to_use":"Angajman oncesi OPSEC planini ekiple tatbik et.","mitigation":"Brief/debrief, iletisim plani, geri cekilme ve eskalasyon kurallari.","source":"https://trustedsec.com/blog","level":"advanced","status":"active"}],"tools":[{"id":"TOOL-001","name":"Lock Pick Seti","vendor":"Çeşitli (SouthOrd/Sparrows)","type":"offense","areas":["FZ04"],"what":"Pimli silindir kilitleri YASAL olarak (locksport, kendi kilidin) acmayi ogrenmek icin gerginlik anahtari + pik seti. Fiziksel degerlendirmenin ve kilit dayanikliligini anlamanin temeli.","how_to_use":"Seffaf kilit veya kendi asma kilidinle single-pin picking ve raking calis. Yalnizca sahibi oldugun/izinli kilitlerde.","source":"https://www.artoflockpicking.com/"},{"id":"TOOL-002","name":"Bump Key Seti","vendor":"Çeşitli","type":"offense","areas":["FZ04"],"what":"Pimleri ani darbeyle hizalayarak uygun kilitleri acan ozel kesilmis anahtarlar. Kilidin bump'a dayanikliligini test etmek icin.","how_to_use":"Kendi kilidinde bump teknigini dene; bump-dirençli kilitlerle farki gozlemle.","source":"https://toool.us/"},{"id":"TOOL-003","name":"Bypass Araçları (traveler hook / under-door / shove)","vendor":"Sparrows/SEREPICK","type":"offense","areas":["FZ02","FZ04"],"what":"Kilidi hic acmadan kapi donanimindaki (ic kol, REX, mandal) zayifligi kullanan aparatlar. Cogu gercek giris bu yolla olur.","how_to_use":"Kendi/izinli kapilarinda kapi bosluklarini ve ic donanim erisimini degerlendir; savunma onerisi uret.","source":"https://trustedsec.com/blog"},{"id":"TOOL-004","name":"Proxmark3 (RDV4)","vendor":"RFID Research Group","type":"both","areas":["FZ03"],"what":"RFID/NFC arastirma ve erisim kontrol degerlendirmesinin standart cihazi. LF (125 kHz) ve HF (13.56 MHz) kartlari okur/analiz eder; kart ailesini ve zayifligini tespit eder.","how_to_use":"Kendi/test kartlarinla kart teknolojisini tani, zayif kartlari raporla, savunma (modern kart) oner.","install":"github.com/RfidResearchGroup/proxmark3","source":"https://github.com/RfidResearchGroup/proxmark3/wiki"},{"id":"TOOL-005","name":"Flipper Zero","vendor":"Flipper Devices","type":"both","areas":["FZ03","FZ07","FZ08"],"what":"Cok amacli tasinabilir arac: sub-GHz RF, 125 kHz RFID, NFC, kizilotesi, GPIO ve HID. Ogrenme ve farkindalik demolari icin cok yonlu.","how_to_use":"Kendi kumandan/kartin/cihazinla protokolleri incele; kapsam ici degerlendirmede hizli triyaj araci olarak kullan.","install":"flipperzero.one","source":"https://docs.flipper.net/"},{"id":"TOOL-006","name":"YARD Stick One","vendor":"Great Scott Gadgets","type":"offense","areas":["FZ07"],"what":"Alt-GHz (300-900 MHz) kablosuz sinyalleri yakalama/gonderme icin USB radyo. Kumanda/sensor protokollerini incelemek icin.","how_to_use":"Kendi RF cihazlarinin sinyallerini rfcat ile incele; sabit vs rolling kod farkini gozlemle.","source":"https://greatscottgadgets.com/yardstickone/"},{"id":"TOOL-007","name":"HackRF One","vendor":"Great Scott Gadgets","type":"both","areas":["FZ07"],"what":"1 MHz-6 GHz genis bantli Yazilim Tanimli Radyo (SDR). Genis RF yelpazesini gozlemleme ve (yetkili) iletim icin.","how_to_use":"GNU Radio/SDR araclariyla kendi cihazlarinin spektrumunu incele; sinyal analizi ogren.","install":"greatscottgadgets.com/hackrf","source":"https://greatscottgadgets.com/hackrf/"},{"id":"TOOL-008","name":"RTL-SDR Dongle","vendor":"RTL-SDR.com / Çeşitli","type":"both","areas":["FZ07","FZ01"],"what":"Ucuz (~20$) alici-only SDR. RF spektrumunu dinlemek, sensor/kumanda sinyallerini gozlemlemek icin baslangic araci.","how_to_use":"Kendi kumandanin frekansini bul, sinyali kaydet, protokolu incele. RF ogrenmenin en ucuz giris kapisi.","install":"rtl-sdr.com/qsg","source":"https://www.rtl-sdr.com/about-rtl-sdr/"},{"id":"TOOL-009","name":"ESPKey","vendor":"Red Team Tools","type":"offense","areas":["FZ03"],"what":"Wiegand kart okuyucu ile panel arasina takilan kucuk implant; gecen kart kimliklerini kaydeder (yetkili test).","how_to_use":"Kendi test okuyucunda Wiegand'in neden sifrelenmesi (OSDP) gerektigini goster.","source":"https://github.com/octosavvi/ESPKey"},{"id":"TOOL-010","name":"USB Rubber Ducky","vendor":"Hak5","type":"offense","areas":["FZ08"],"what":"Klavye gibi gorunup onceden yazilmis tuslari saniyeler icinde gonderen HID enjeksiyon cihazi. Kilitsiz oturum riskini gostermek icin.","how_to_use":"Kendi makinende ZARARSIZ bir payload (not defteri acip mesaj yazmak) ile HID guveninin tehlikesini demo et.","install":"shop.hak5.org","source":"https://docs.hak5.org/hak5-usb-rubber-ducky"},{"id":"TOOL-011","name":"Bash Bunny","vendor":"Hak5","type":"offense","areas":["FZ08"],"what":"USB uzerinden coklu saldiri (HID, depolama, ag adaptoru) yapabilen gelismis cihaz. Yetkili degerlendirmede cok yonlu.","how_to_use":"Kendi laboratuvarinda farkli USB saldiri senaryolarini (zararsiz) dene.","source":"https://docs.hak5.org/bash-bunny"},{"id":"TOOL-012","name":"Shark Jack / Packet Squirrel / LAN Turtle","vendor":"Hak5","type":"offense","areas":["FZ08"],"what":"Ic aga takilip hizli tarama veya disari tunel acan kucuk ag cihazlari ('drop box'). Bos port + fiziksel erisim riskini gosterir.","how_to_use":"Yetkili testte bos porta tak, NAC'in cihazi engelleyip engellemedigini degerlendir; raporla.","source":"https://docs.hak5.org/"},{"id":"TOOL-013","name":"O.MG Cable","vendor":"MG / Hak5","type":"offense","areas":["FZ08"],"what":"Normal sarj/veri kablosu gibi gorunen ama icinde HID enjeksiyon + kablosuz kontrol barindiran implant kablo.","how_to_use":"Kendi makinende zararsiz demo ile 'guvenilir kablo' varsayiminin riskini goster.","source":"https://o.mg.lol/"},{"id":"TOOL-014","name":"Raspberry Pi (drop platformu)","vendor":"Raspberry Pi Foundation","type":"both","areas":["FZ08"],"what":"Ucuz tek kart bilgisayar; yetkili testlerde tasinabilir 'dropbox' veya evde ogrenme laboratuvari olarak kullanilir.","how_to_use":"Kendi aginda bir Pi'yi uzaktan erisimli test cihazina cevir; ag segmentasyonu/NAC'i kendi ortaminda ogren.","install":"raspberrypi.com","source":"https://www.raspberrypi.com/"},{"id":"TOOL-015","name":"Termal Kamera (FLIR/benzeri)","vendor":"FLIR / Çeşitli","type":"offense","areas":["FZ01"],"what":"Isi izlerini goruntuler; tus takiminda son basilan tuslar veya yeni kullanilan yuzeyler hakkinda ipucu verir.","how_to_use":"Kendi keypad'inde isi sizintisini gozlemle; isi dagitan tasarim onerisi uret.","source":"https://www.flir.com/"},{"id":"TOOL-016","name":"Multimetre + Logic Analyzer + Bus Pirate","vendor":"Çeşitli / Dangerous Prototypes","type":"both","areas":["FZ08"],"what":"Donanim arayuzlerini (UART/SPI/I2C/JTAG) kesfetmek, pinleri olcmek ve haberlesmeyi incelemek icin temel donanim hack seti.","how_to_use":"Kendi/eski bir IoT cihazinda debug pinlerini bul, UART konsolunu oku, firmware/gunluk analiz et.","source":"https://dangerousprototypes.com/docs/Bus_Pirate"},{"id":"TOOL-017","name":"ESP8266 / ESP32 Geliştirme Kartı","vendor":"Espressif","type":"offense","areas":["FZ07"],"what":"Ucuz Wi-Fi/Bluetooth mikrodenetleyici. Kendi aginda kablosuz farkindalik demolari (deauth, sahte AP) ve sensor projeleri icin.","how_to_use":"Kendi test aginda Wi-Fi dayanikliligini olc; sensor okuma projeleri yap.","install":"arduino.cc / platformio","source":"https://www.espressif.com/"},{"id":"TOOL-018","name":"PN532 NFC Modülü","vendor":"NXP / Adafruit","type":"both","areas":["FZ03"],"what":"Arduino/Pi ile NFC/13.56 MHz kart okumayi ogrenmek icin ucuz modul. Erisim kontrol temellerini anlamanin en kolay yolu.","how_to_use":"Kendi NFC kartini oku, UID/sektor kavramlarini ogren; proje olarak kur.","install":"learn.adafruit.com/adafruit-pn532-rfid-nfc","source":"https://learn.adafruit.com/adafruit-pn532-rfid-nfc"},{"id":"TOOL-019","name":"RFID Engelleyici Kılıf / Faraday Kesesi","vendor":"Çeşitli","type":"defense","areas":["FZ03","FZ09"],"what":"Kartin/telefonun izinsiz okunmasini engelleyen ekranlama. Yakin mesafe kart okuma saldirisina karsi basit, etkili onlem.","how_to_use":"Calisanlara dagitimi oner; kart okuma demosu ile oncesi/sonrasini goster.","source":"https://www.nist.gov/"},{"id":"TOOL-020","name":"CPTED İlkeleri","vendor":"CPTED","type":"framework","areas":["FZ02","FZ01"],"what":"Cevresel Tasarim Yoluyla Suc Onleme: aydinlatma, gorus hatti, dogal gozetim, erisim kontrolu ilkeleri. Fiziksel savunmanin tasarim cercevesi.","how_to_use":"Bina cevresini CPTED kontrol listesiyle puanla; dusuk maliyetli iyilestirme oner.","source":"https://www.cpted.net/"},{"id":"TOOL-021","name":"OSDP (Secure Channel)","vendor":"SIA","type":"defense","areas":["FZ03"],"what":"Wiegand'in yerini alan, sifreli ve cift yonlu kart okuyucu protokolu. Hat dinleme/tekrar saldirilarina karsi modern savunma.","how_to_use":"Musterinin okuyucu-panel haberlesmesini OSDP'ye tasimasini oner.","source":"https://www.securityindustry.org/industry-standards/open-supervised-device-protocol/"},{"id":"TOOL-022","name":"TrustedSec — Physical Pentest Kaynakları","vendor":"TrustedSec","type":"framework","areas":["FZ10","FZ02"],"what":"Fiziksel kirmizi takim metodolojisi, yetki/kapsam sablonlari ve saha deneyim yazilari. Angajman disiplininin referansi.","how_to_use":"Her angajman oncesi yetki mektubu + RoE sablonlarini buradan uyarla.","source":"https://trustedsec.com/blog"},{"id":"TOOL-023","name":"DEF CON Physical Security / Lockpick Village","vendor":"DEF CON","type":"framework","areas":["FZ04"],"what":"Fiziksel guvenlik ve locksport konularinda topluluk sunumlari ve ogrenme kaynaklari (YASAL pratik kulturu).","how_to_use":"Teknikleri ogrenmek ve topluluk etigini benimsemek icin sunumlari izle.","source":"https://www.defcon.org/"},{"id":"TOOL-024","name":"OSINT Framework","vendor":"OSINT Framework","type":"framework","areas":["FZ01"],"what":"Acik kaynak kesif araclarinin kategorize dizini. Pasif tesis/kisi kesfinin baslangic noktasi.","how_to_use":"Angajman oncesi pasif kesif icin araclari buradan sec; bulgulari raporla.","source":"https://osintframework.com/"},{"id":"TOOL-025","name":"Keşif Dronu (hava keşfi)","vendor":"DJI / Çeşitli","type":"both","areas":["FZ01","FZ02"],"what":"Yukaridan tesis cevresini, cati, avlu, kor nokta ve giris akisini goruntuleyen insansiz hava araci. Yetkili degerlendirmede hizli hava kesfi ve CPTED gozlemi; savunmada drone tespiti gerekliligini gosterir.","how_to_use":"Yetkili alan uzerinde, YEREL HAVACILIK KURALLARINA uyarak ucur; cevre zayifliklarini ve kor noktalari yukaridan haritala. Gizlilik/izin sart.","source":"https://trustedsec.com/blog"},{"id":"TOOL-026","name":"GPS İzleyici / Varlık Takibi","vendor":"Çeşitli","type":"both","areas":["FZ01"],"what":"Bir araci/varligin konumunu takip eden kucuk GPS cihazi. Yetkili testte lojistik/rota analizi; karsi tarafta 'aracima izleyici konmus mu' farkindaligi ve tarama.","how_to_use":"SADECE kendi/izinli varlikta. Konum gizliligine saygi; izinsiz kisi takibi YASAK ve suctur.","source":"https://www.sans.org/"},{"id":"TOOL-027","name":"Dürbün / Uzun Menzil Optik","vendor":"Çeşitli","type":"offense","areas":["FZ01"],"what":"Uzaktan gozlem icin dürbün/spotting scope. Giris-cikis paternleri, rozet tasarimi ve kapi donanimini guvenli mesafeden gozlemlemek icin.","how_to_use":"Kamuya acik/izinli konumdan gozlem yap; mahremiyete girme, kisiyi hedef alma.","source":"https://trustedsec.com/blog"},{"id":"TOOL-028","name":"Endoskop / Muayene Kamerası","vendor":"Çeşitli","type":"offense","areas":["FZ02","FZ04"],"what":"Esnek uclu mini kamera. Kapi alti bosluklarini, kilit mekanizmasini veya ulasilmasi zor noktalari gormek icin.","how_to_use":"Kendi/izinli kapi ve kilitlerinde bosluk/donanim degerlendir. Savunma: kapi alti plakasi onerisi.","source":"https://www.artoflockpicking.com/"},{"id":"TOOL-029","name":"Wi-Fi Pineapple","vendor":"Hak5","type":"offense","areas":["FZ07"],"what":"Sahte erisim noktasi (rogue AP) kurarak kablosuz istemci davranisini ve aga baglanma guvenligini test eden cihaz.","how_to_use":"KENDI test aginda/izinli kapsamada sahte AP dayanikliligini olc; savunma: WPA3/802.1X, rogue AP tespiti oner.","install":"shop.hak5.org","source":"https://docs.hak5.org/wifi-pineapple"},{"id":"TOOL-030","name":"Donanım Keylogger (farkındalık)","vendor":"Çeşitli","type":"offense","areas":["FZ08"],"what":"Klavye ile bilgisayar arasina takilan, tus vuruslarini kaydeden kucuk cihaz. Fiziksel erisim riskini ve karsi onlemi gostermek icin.","how_to_use":"SADECE kendi makinende demo; USB port denetimi ve fiziksel erisim kisitinin onemini goster. Savunma odakli kullan.","source":"https://www.sans.org/"},{"id":"TOOL-031","name":"RF / Böcek Dedektörü (karşı-gözetim)","vendor":"Çeşitli","type":"defense","areas":["FZ06","FZ07"],"what":"Ortamdaki gizli verici/dinleme cihazi ve anormal RF yayinlarini tespit eden counter-surveillance araci.","how_to_use":"Hassas toplanti alanlarini tara; gizli verici/kamera var mi degerlendir. TSCM (teknik gozetim karsi onlemi) temeli.","source":"https://www.sans.org/"},{"id":"TOOL-032","name":"Gizli Kamera Dedektörü","vendor":"Çeşitli","type":"defense","areas":["FZ06"],"what":"Lens yansimasi ve IR ile gizli kameralari bulan cihaz. Mahremiyet ve karsi-gozetim degerlendirmesi icin.","how_to_use":"Konaklama/toplanti/soyunma alanlarini tara; bulunan kamerayi yetkiliye bildir.","source":"https://www.sans.org/"},{"id":"TOOL-033","name":"Body Cam / Kanıt Kayıt Cihazı","vendor":"Çeşitli","type":"both","areas":["FZ10"],"what":"Angajman sirasinda erisimi ve bulgulari zaman damgali kaydeden giyilebilir kamera. Delil zinciri ve rapor icin.","how_to_use":"Yetki kapsaminda kayit al; mahremiyet ve veri saklama kurallarina uy. Kanitlari guvenli sakla.","source":"https://trustedsec.com/blog"},{"id":"TOOL-034","name":"Tamper-Evident Mühür / Etiket","vendor":"Çeşitli","type":"defense","areas":["FZ08","FZ10"],"what":"Acildiginda iz birakan guvenlik muhru/etiketi. Cihaz muhafazasi, kapi ve kabinlerin mudahale edilip edilmedigini gosterir.","how_to_use":"Kritik donanimi muhurle; mudahale izini kontrol et. Fiziksel butunluk savunmasi.","source":"https://www.nist.gov/"},{"id":"TOOL-035","name":"DroneShield RfRecon","vendor":"DroneShield","type":"defense","areas":["FZ01","FZ07"],"what":"Ağustos 2026'da duyurulan taşınabilir RF istihbarat ve drone tespit cihazı. Geniş bant spektrum izleme, yön bulma, yapay zekâ destekli sinyal tanıma ve Remote ID (Wi-Fi/Bluetooth) tespitini tek cihazda birleştirir. Pasif çalışır; sinyal yaymaz.","how_to_use":"Savunma tarafı aracıdır: kritik tesis çevresinde drone ve şüpheli RF etkinliğini tespit edip kaydetmek için kullanılır. Kurumsal/devlet sınıfı bir üründür; öğrenme için aynı fikri kendi RTL-SDR'ınla ve Remote ID alıcı uygulamalarıyla kendi drone'un üzerinde deneyebilirsin. Mahremiyet ve izin: Başkalarının iletişim içeriğini dinlemek/çözmek yasal değildir; yalnızca yetkili olduğun tesiste ve mevzuata uygun izleme yap. Karıştırma (jamming) sivillere yasaktır.","install":"Ticari ürün; satıcı üzerinden kurumsal temin. Öğrenme alternatifi: RTL-SDR + açık kaynak Remote ID alıcı uygulamaları.","source":"https://uasweekly.com/2026/08/11/droneshield-unveils-rfrecon-to-advance-counter-uas-rf-intelligence-and-drone-detection/"}],"practice":[{"id":"PR-001","name":"TOOOL — Locksport Topluluğu","vendor":"TOOOL","url":"https://toool.us/","cost":"ücretsiz","kind":"topluluk","areas":["FZ04"],"what":"Kilit açmayı YASAL öğrenme kültürü, etik kuralları ve etkinlikler.","how":"Kendi kilidinle pratik yap; topluluk etik kurallarını benimse."},{"id":"PR-002","name":"Art of Lock Picking","vendor":"Art of Lock Picking","url":"https://www.artoflockpicking.com/","cost":"ücretsiz","kind":"rehber","areas":["FZ04"],"what":"Pin picking, raking, bypass temelleri; başlangıç rehberleri.","how":"Şeffaf kilitle başla, adım adım teknikleri uygula."},{"id":"PR-003","name":"Proxmark3 Wiki (RRG)","vendor":"RFID Research Group","url":"https://github.com/RfidResearchGroup/proxmark3/wiki","cost":"ücretsiz","kind":"rehber","areas":["FZ03"],"what":"RFID/NFC erişim kontrol araştırmasının referansı.","how":"Kendi kartlarınla kart teknolojisini tanı, komutları öğren."},{"id":"PR-004","name":"Adafruit PN532 Dersi","vendor":"Adafruit","url":"https://learn.adafruit.com/adafruit-pn532-rfid-nfc","cost":"donanım ~15$","kind":"proje","areas":["FZ03"],"what":"Arduino/Pi ile NFC okuma öğrenmenin en kolay yolu.","how":"PN532 modülü al, kendi kartını oku, UID kavramını anla."},{"id":"PR-005","name":"rtl-sdr.com — Başlangıç","vendor":"RTL-SDR.com","url":"https://www.rtl-sdr.com/about-rtl-sdr/","cost":"donanım ~25$","kind":"rehber","areas":["FZ07"],"what":"Ucuz SDR ile RF spektrumunu dinlemeyi öğrenme.","how":"Dongle al, SDR# kur, kendi kumandanın sinyalini gözlemle."},{"id":"PR-006","name":"rtl_433","vendor":"merbanan","url":"https://github.com/merbanan/rtl_433","cost":"ücretsiz","kind":"araç","areas":["FZ07"],"what":"433/315 MHz cihaz sinyallerini çözen açık kaynak araç.","how":"Kendi kablosuz sensörünü tetikle, mesajı oku."},{"id":"PR-007","name":"GNU Radio Dersleri","vendor":"GNU Radio","url":"https://wiki.gnuradio.org/index.php/Tutorials","cost":"ücretsiz","kind":"rehber","areas":["FZ07"],"what":"SDR ile sinyal işleme blok tabanlı öğrenme.","how":"Flowgraph kurarak kendi sinyallerini analiz et."},{"id":"PR-008","name":"Hardwear.io","vendor":"Hardwear.io","url":"https://hardwear.io/","cost":"ücretsiz içerik","kind":"topluluk","areas":["FZ08"],"what":"Donanım güvenliği (UART/JTAG/flash) sunumları ve eğitimleri.","how":"Sunumları izle; kendi eski cihazında debug arayüzü ara."},{"id":"PR-009","name":"Arduino Learn","vendor":"Arduino","url":"https://docs.arduino.cc/learn/","cost":"ücretsiz","kind":"rehber","areas":["FZ05","FZ08"],"what":"Sensör/aktüatör ve gömülü temelleri.","how":"Kendi sensör projeni kur; algılama mantığını öğren."},{"id":"PR-010","name":"Raspberry Pi Docs","vendor":"Raspberry Pi","url":"https://www.raspberrypi.com/documentation/","cost":"ücretsiz","kind":"rehber","areas":["FZ08"],"what":"Tek kart bilgisayar; drop/laboratuvar platformu.","how":"Kendi ağında Pi kur; NAC/segmentasyon kavramını dene."},{"id":"PR-011","name":"Social-Engineer.org","vendor":"Social-Engineer, LLC","url":"https://www.social-engineer.org/","cost":"ücretsiz","kind":"rehber","areas":["FZ09"],"what":"İnsan katmanı: pretexting, tailgating, farkındalık.","how":"Çerçeveyi oku; kendi ekibinde farkındalık senaryosu tasarla."},{"id":"PR-012","name":"TrustedSec Blog","vendor":"TrustedSec","url":"https://trustedsec.com/blog","cost":"ücretsiz","kind":"rehber","areas":["FZ10","FZ02"],"what":"Fiziksel kırmızı takım metodolojisi ve saha yazıları.","how":"Yetki mektubu + RoE şablonlarını buradan uyarla."},{"id":"PR-013","name":"DEF CON — Physical Security","vendor":"DEF CON","url":"https://www.defcon.org/","cost":"ücretsiz","kind":"topluluk","areas":["FZ04","FZ02"],"what":"Fiziksel güvenlik ve lockpick village içerikleri.","how":"Sunumları izle, topluluk etiğini benimse."},{"id":"PR-014","name":"OSINT Framework","vendor":"OSINT Framework","url":"https://osintframework.com/","cost":"ücretsiz","kind":"araç","areas":["FZ01"],"what":"Pasif keşif araçlarının kategorize dizini.","how":"Angajman öncesi pasif keşif için araçları seç."},{"id":"PR-015","name":"HackTheBox","vendor":"Hack The Box","url":"https://www.hackthebox.com/","cost":"freemium","kind":"platform","areas":["FZ06","FZ08"],"what":"Ağ/cihaz güvenliği pratik laboratuvarları.","how":"Kamera/IoT temalı makinelerde pratik yap."}],"questions":[{"id":"Q-0001","area":"FZ01","prompt":"Yetkili bir keşif aşamasında ekip tesise hiç yaklaşmadan uydu görüntüsü, çalışan paylaşımları ve iş ilanlarını inceliyor. Bu çalışma en doğru hangi kategoriye girer?","context":"","options":["Pasif keşif: hedefle doğrudan temas yok","Aktif keşif: hedef sistemle etkileşim var","Sosyal mühendislik: kişiyle doğrudan temas","Fiziksel sızma: tesis sınırının aşılması"],"answer":0,"explain":"Açık kaynaktan, hedefe dokunmadan yapılan toplama pasif keşiftir; iz bırakmaz ama yine de kapsam belgesinde tanımlı olmalıdır.","source_id":"","source":"https://osintframework.com/","added":"2026-10-01","author":"daily"},{"id":"Q-0002","area":"FZ01","prompt":"Bir iş ilanında belirli bir erişim kontrol yazılımının yönetim deneyiminin aranması bir değerlendirici için ne anlama gelir?","context":"","options":["Kullanılan erişim kontrol platformu hakkında ipucu verir","Binadaki kamera sayısı hakkında kesin bilgi verir","Kart okuyucuların frekansını doğrudan kanıtlar","Güvenlik görevlilerinin vardiya saatini gösterir"],"answer":0,"explain":"İlanlar teknoloji yığınını sızdırır; bu bir ipucudur, kanıt değildir ve sahada doğrulanması gerekir. Savunma: ilanlarda ürün adlarını genelleştirmek.","source_id":"","source":"https://www.blackhillsinfosec.com/rfid-proximity-cloning-attacks/","added":"2026-10-01","author":"daily"},{"id":"Q-0003","area":"FZ01","prompt":"Bir tesisin savunma ekibi, yakına gelen drone'ları tespit etmek için Remote ID yayınlarını dinliyor. Remote ID ne sağlar?","context":"","options":["Uyumlu drone'un kimliği ile konum bilgisini yayınlar","Drone'un kamera görüntüsünü yere aktarmayı engeller","Drone'un kumanda sinyalini otomatik olarak keser","Drone'un yalnızca gece uçuşunu kayda alır"],"answer":0,"explain":"Remote ID, uyumlu drone'un kimlik ve konum bilgisini Wi-Fi/Bluetooth üzerinden yayınlamasıdır; pasif dinleme ile tespit edilir. Karıştırma (jamming) çoğu ülkede sivillere yasaktır.","source_id":"","source":"https://sky.trade/articles/remote-id-2026","added":"2026-10-01","author":"daily"},{"id":"Q-0004","area":"FZ02","prompt":"Mantrap (çift kapılı geçiş bölmesi) en çok hangi riski azaltmak için tasarlanır?","context":"","options":["Kartla geçen kişinin arkasından ikinci kişinin girmesi","Kart okuyucunun kablosunun dışarıdan sökülmesi","Kamera kayıtlarının yetkisiz kişilerce izlenmesi","Kilit silindirinin mekanik olarak açılması"],"answer":0,"explain":"Mantrap aynı anda tek kapının açık olmasını ve bölmede tek kişi bulunmasını sağlayarak tailgating/piggybacking'i zorlaştırır.","source_id":"","source":"https://en.wikipedia.org/wiki/Mantrap_(access_control)","added":"2026-10-01","author":"daily"},{"id":"Q-0005","area":"FZ02","prompt":"CPTED'deki 'doğal gözetim' ilkesine en uygun önlem hangisidir?","context":"","options":["Girişi görüş hattında tutan alçak bitki ve iyi aydınlatma","Girişe kart okuyucu ile ikinci bir turnike eklemek","Kapı kontağına zaman gecikmeli alarm bağlamak","Güvenlik odasına ek monitör ve kayıt cihazı koymak"],"answer":0,"explain":"Doğal gözetim; tasarımla insanların alanı doğal olarak görebilmesidir (peyzaj, aydınlatma, pencere). Turnike erişim kontrolü, monitör ise elektronik gözetimdir.","source_id":"","source":"https://en.wikipedia.org/wiki/Crime_prevention_through_environmental_design","added":"2026-10-01","author":"daily"},{"id":"Q-0006","area":"FZ02","prompt":"Yetkili bir değerlendirmede yükleme rampasının kepenk kapısı kilitli ama yanındaki yaya kapısı kolla açılıyor. Bu bulgu öncelikle hangi alana yazılır?","context":"","options":["Çevre & bariyerler: zincirin en zayıf halkası","Kilit & mekanik bypass: silindir zafiyeti","Alarm & algılayıcılar: sensör körlüğü","İnsan katmanı: personelin ikna edilmesi"],"answer":0,"explain":"Sorun bir kilidin açılması değil, çevre katmanında korumasız bırakılmış bir geçiş noktasıdır. FZ04 kilidin kendisini, FZ02 bariyer bütünlüğünü inceler.","source_id":"","source":"https://trustedsec.com/","added":"2026-10-01","author":"daily"},{"id":"Q-0007","area":"FZ03","prompt":"125 kHz HID Prox kartının kopyalanabilmesinin temel nedeni nedir?","context":"","options":["Kart her okumada aynı sabit kimliği şifresiz gönderir","Kart Crypto1 anahtarıyla zayıf biçimde şifrelenir","Kart okuyucuya bağlanan Wiegand hattı uzun kalır","Kart her okumada değişen ama tahmin edilen kod üretir"],"answer":0,"explain":"Prox kartlarda kimlik doğrulama yoktur; sabit bir numara yayınlanır. Crypto1 MIFARE Classic'e (13,56 MHz) aittir; bu ikisi sık karıştırılır.","source_id":"","source":"https://www.blackhillsinfosec.com/rfid-proximity-cloning-attacks/","added":"2026-10-01","author":"daily"},{"id":"Q-0008","area":"FZ03","prompt":"Wiegand ile OSDP Secure Channel arasındaki en önemli güvenlik farkı hangisidir?","context":"","options":["OSDP SC okuyucu-kontrolcü hattını şifreler, Wiegand şifrelemez","Wiegand çift yönlüdür, OSDP yalnızca tek yönlü veri gönderir","OSDP yalnızca 125 kHz kartlarla, Wiegand 13,56 MHz ile çalışır","Wiegand kartı, OSDP ise yalnızca kontrolcüyü doğrulamaya yarar"],"answer":0,"explain":"Wiegand tek yönlü, şifresiz bir kablo protokolüdür; hattı dinleyen biri kart verisini görür. OSDP çift yönlüdür, Secure Channel ile şifreleme ve bütünlük sağlar ve okuyucu denetimini (tamper) destekler.","source_id":"","source":"https://www.securityindustry.org/industry-standards/open-supervised-device-protocol/","added":"2026-10-01","author":"daily"},{"id":"Q-0009","area":"FZ03","prompt":"MIFARE Classic kartların bilinen zayıflığı hangi bileşenden kaynaklanır?","context":"","options":["Tescilli Crypto1 şifresinin kırılmış olması","Kartın hiçbir şifreleme kullanmadan UID yollaması","Kartın 125 kHz bandında uzun menzilli okunması","Kartın AES anahtarının kart yüzüne basılı olması"],"answer":0,"explain":"MIFARE Classic, 2008'de kırılan tescilli Crypto1 şifresini kullanır; anahtar kurtarma saldırıları bu yüzden mümkündür. Savunma: DESFire EV2/EV3 veya Seos gibi modern kimliklere geçiş.","source_id":"","source":"https://en.wikipedia.org/wiki/MIFARE","added":"2026-10-01","author":"daily"},{"id":"Q-0010","area":"FZ03","prompt":"Okuyucu yalnızca kartın UID'sini kontrol ediyor, sektör verisini doğrulamıyorsa risk nedir?","context":"","options":["UID'si değiştirilebilen bir kartla kimlik taklit edilebilir","Kartın içindeki şifreli sektörler kendiliğinden silinir","Okuyucu her kartı reddeder ve kapı kilitli kalır","Kontrolcü OSDP yerine otomatik olarak Wiegand'a geçer"],"answer":0,"explain":"UID bir kimlik doğrulama değil, bir etikettir; bazı özel kartlar UID yazılmasına izin verir. Doğru tasarım kriptografik karşılıklı doğrulama yapar.","source_id":"","source":"https://github.com/RfidResearchGroup/proxmark3","added":"2026-10-01","author":"daily"},{"id":"Q-0011","area":"FZ04","prompt":"Pin-tumbler kilitlerde 'bump key' tekniği hangi fiziksel ilkeye dayanır?","context":"","options":["Darbe enerjisinin pinleri anlık olarak kesme hattından ayırması","Gerilim anahtarıyla pinlerin tek tek kesme hattına oturtulması","Kilidin yayını ısı ile zayıflatıp silindiri döndürmesi","Kapı ile kasa arasındaki boşluktan dili geri itmesi"],"answer":0,"explain":"Bump key enerjiyi alt pinlerden üst pinlere aktarır (Newton beşiği gibi); kısa bir an kesme hattı açılır. Tek tek pin oturtma 'picking', dili itmek ise 'bypass'tır. Savunma: bump'a dayanıklı silindir.","source_id":"","source":"https://en.wikipedia.org/wiki/Bump_key","added":"2026-10-01","author":"daily"},{"id":"Q-0012","area":"FZ04","prompt":"Değerlendirmede kapı, silindiri hiç açılmadan 'latch slipping' ile açıldı. Bu hangi kategoriye en iyi uyar?","context":"","options":["Bypass: kilit mekanizması atlanıp dil itildi","Picking: pinler tek tek kesme hattına oturtuldu","Impressioning: anahtar izlerden yeniden üretildi","Decoding: anahtar kesimleri dışarıdan okundu"],"answer":0,"explain":"Bypass, kilidin pinlerini çözmeden mekanizmanın çevresinden dolaşır. Savunma: kilit dili koruyucu (latch guard) ve deadlatch'li kilitler.","source_id":"","source":"https://toool.us/","added":"2026-10-01","author":"daily"},{"id":"Q-0013","area":"FZ04","prompt":"Master-key sistemlerinin genel bir riski hangisidir?","context":"","options":["Ek kesme hatları, kilidi açan anahtar sayısını artırır","Tek bir anahtar kaybı yalnızca tek kapıyı etkiler","Silindirler bump tekniğine karşı tamamen bağışık olur","Tüm kapılar kartlı okuyucuya geçmek zorunda kalır"],"answer":0,"explain":"Master pinler her silindirde ek kesme noktası yaratır; bu tolerans ve anahtar türetme riski doğurur. Kaybolan master anahtar tüm sistemi etkiler.","source_id":"","source":"https://toool.us/","added":"2026-10-01","author":"daily"},{"id":"Q-0014","area":"FZ05","prompt":"Kapı kontağı (manyetik reed) ile PIR sensör arasındaki temel fark nedir?","context":"","options":["Reed kapının açılmasını, PIR ısı hareketini algılar","Reed ısı değişimini, PIR manyetik alanı algılar","Reed yalnızca camın kırılmasını, PIR titreşimi algılar","Reed ve PIR aynı ilkeyle, farklı menzilde çalışır"],"answer":0,"explain":"Reed kontak mıknatıs ayrılınca durum değiştirir; PIR ortam ile insan arasındaki kızılötesi (ısı) farkının hareketini görür. Katmanlı tasarım ikisini birlikte kullanır.","source_id":"","source":"https://en.wikipedia.org/wiki/Passive_infrared_sensor","added":"2026-10-01","author":"daily"},{"id":"Q-0015","area":"FZ05","prompt":"Request-to-Exit (REX) sensörü yanlış yerleştirildiğinde ne olur?","context":"","options":["Dışarıdan tetiklenerek kilidi açabilir veya alarmı bastırır","Kart okuyucunun kimlik doğrulamasını şifreli hale getirir","Kapının yangın anında kilitli kalmasına neden olur","Kamera kaydını keserek kör nokta oluşturur"],"answer":0,"explain":"REX, içeriden çıkışta alarmı bastırmak veya kilidi açmak için hareket algılar. Kapı aralığından tetiklenebilecek açıdaysa zayıflık olur. Savunma: doğru konum, maskeli lens, mekanik çıkış.","source_id":"","source":"https://en.wikipedia.org/wiki/Request_to_exit","added":"2026-10-01","author":"daily"},{"id":"Q-0016","area":"FZ05","prompt":"Alarm sisteminde 'hat süpervizyonu' (EOL direnci) neyi tespit etmek için kullanılır?","context":"","options":["Sensör hattının kesilmesi veya kısa devre edilmesi","Kameranın görüş alanının ışıkla körleştirilmesi","Kartın okuyucuya fazla yakın tutulması","Kapı kilidinin pinlerinin zamanla aşınması"],"answer":0,"explain":"Hat sonu direnci, panelin normal/alarm/kesik/kısa devre durumlarını ayırt etmesini sağlar; böylece kabloya müdahale fark edilir. Kamera körleştirme FZ06 konusudur.","source_id":"","source":"https://en.wikipedia.org/wiki/Burglar_alarm","added":"2026-10-01","author":"daily"},{"id":"Q-0017","area":"FZ06","prompt":"Kızılötesi (IR) geceleme kameralarına güçlü IR ışık tutulmasının etkisi nedir?","context":"","options":["Sensör doyar, görüntü parlak lekeyle kör kalır","Kamera otomatik olarak termal görüntüye geçer","Kayıt cihazı alarm üretmeden kaydı siler","Kamera ağ bağlantısını keserek yeniden başlar"],"answer":0,"explain":"IR'ye duyarlı sensörler, göze görünmeyen güçlü ışıkla doyabilir. Savunma: görüntü kaybı/doyum analitiği, çakışan kapsama ve farklı açıdan ikinci kamera.","source_id":"","source":"https://en.wikipedia.org/wiki/Closed-circuit_television","added":"2026-10-01","author":"daily"},{"id":"Q-0018","area":"FZ06","prompt":"Gözetim sisteminde 'kayıt saklama süresi' bir değerlendirme bulgusu olarak neden önemlidir?","context":"","options":["Olay geç fark edilirse kanıt silinmiş olabilir","Kısa süre, kameraların çözünürlüğünü düşürür","Uzun süre, kart okuyucuların hızını yavaşlatır","Süre, kameraların IR menzilini belirler"],"answer":0,"explain":"Fiziksel olaylar çoğu zaman günler sonra fark edilir; saklama süresi soruşturma kapasitesini belirler. KVKK'ya uygun ve amaçla orantılı olmalıdır.","source_id":"","source":"https://en.wikipedia.org/wiki/Closed-circuit_television","added":"2026-10-01","author":"daily"},{"id":"Q-0019","area":"FZ06","prompt":"Bir IP kameranın varsayılan parolayla ağa açık olması hangi alanın ve hangi riskin konusudur?","context":"","options":["Gözetim: görüntünün izlenmesi veya kaydın kapatılması","Kilit: silindirin uzaktan mekanik olarak açılması","Alarm: reed kontağın manyetik olarak kandırılması","İnsan katmanı: resepsiyonun telefonla ikna edilmesi"],"answer":0,"explain":"IP kameralar ağ cihazıdır; zayıf kimlik bilgileri görüntü sızıntısı ve kayıt manipülasyonu riskidir. Savunma: ayrı VLAN, güçlü parola, yama.","source_id":"","source":"https://securithings.com/blog/when-locked-doors-lie-the-disturbing-truth-about-access-control-systems-cves/","added":"2026-10-01","author":"daily"},{"id":"Q-0020","area":"FZ07","prompt":"Sabit kodlu kumanda ile rolling-code kumanda arasındaki fark nedir?","context":"","options":["Rolling code her basışta yeni kod üretir, sabit kod hep aynıdır","Sabit kod şifrelidir, rolling code şifresiz olarak gönderilir","Rolling code yalnızca 125 kHz, sabit kod yalnızca 433 MHz kullanır","Sabit kod çift yönlüdür, rolling code ise tek yönlü çalışır"],"answer":0,"explain":"Sabit kod kaydedilip tekrar oynatılabilir (replay). Rolling code sayaçla değişir; basit tekrar işe yaramaz, ancak bazı tasarım zaafları akademik olarak araştırılmıştır.","source_id":"","source":"https://en.wikipedia.org/wiki/Rolling_code","added":"2026-10-01","author":"daily"},{"id":"Q-0021","area":"FZ07","prompt":"RTL-SDR ile HackRF One arasındaki temel yetenek farkı nedir?","context":"","options":["RTL-SDR yalnızca alır, HackRF alıp yayın da yapabilir","RTL-SDR yayın yapar, HackRF yalnızca dinleme yapar","İkisi de yalnızca 125 kHz RFID kartlarını okur","HackRF yalnızca Wi-Fi, RTL-SDR yalnızca Bluetooth dinler"],"answer":0,"explain":"RTL-SDR ucuz, yalnızca alıcıdır (keşif/analiz). HackRF One yarı çift yönlü verici-alıcıdır; yayın yapmak lisans ve yetki gerektirir.","source_id":"","source":"https://greatscottgadgets.com/hackrf/one/","added":"2026-10-01","author":"daily"},{"id":"Q-0022","area":"FZ07","prompt":"Kendi kumandanızın sinyalini RTL-SDR ile incelerken gördüğünüz OOK modülasyonu nedir?","context":"","options":["Taşıyıcının açılıp kapanmasıyla bit kodlamak","Frekansı iki değer arasında kaydırarak kodlamak","Fazı 180 derece çevirerek bit kodlamak","Veriyi gönderimden önce AES ile şifrelemek"],"answer":0,"explain":"On-Off Keying, ASK'nin en basit hâlidir: sinyal var=1, yok=0. FSK frekans, PSK faz kaydırır; modülasyon şifreleme değildir.","source_id":"","source":"https://www.rtl-sdr.com/about-rtl-sdr/","added":"2026-10-01","author":"daily"},{"id":"Q-0023","area":"FZ08","prompt":"Bir cihaz kartında UART pinlerini bulmak değerlendirici için neden önemlidir?","context":"","options":["Seri konsol, açılış loglarına ve bazen kabuğa erişim verir","UART, cihazın RFID kartlarını uzaktan kopyalamasını sağlar","UART, kameranın IR ışığını otomatik olarak kapatır","UART yalnızca cihazın güç tüketimini ölçmeye yarar"],"answer":0,"explain":"Hata ayıklama konsolu üretimde kapatılmamışsa ciddi bilgi sızıntısı olur. Savunma: üretimde konsolu kapatmak, kimlik doğrulama, kasa tamper koruması.","source_id":"","source":"https://en.wikipedia.org/wiki/Universal_asynchronous_receiver-transmitter","added":"2026-10-01","author":"daily"},{"id":"Q-0024","area":"FZ08","prompt":"UART ile JTAG arasındaki fark en iyi hangisiyle anlatılır?","context":"","options":["UART metin konsoludur, JTAG çipe düşük seviye hata ayıklama erişimidir","UART bellek okur, JTAG yalnızca seri metin akışı sağlar","İkisi aynı protokolün yalnızca farklı pin dizilimleridir","JTAG kablosuz çalışır, UART yalnızca kablolu çalışır"],"answer":0,"explain":"UART bir seri iletişim kanalıdır; JTAG ise işlemciyi durdurma, bellek okuma/yazma gibi düşük seviye erişim verir. JTAG genelde daha güçlü ve daha tehlikelidir.","source_id":"","sou
